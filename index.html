<!--
  ============================================================
  辉宁知识产权 · 网站维护页（单文件自包含，零外部请求）
  ------------------------------------------------------------
  部署：上传到 GitHub Pages / Cloudflare Pages 站点根目录即可。
        若需作为首页显示，把本文件命名为 index.html（原官网
        文件请先重命名为 index_official.html 保留）。

  可改项（都在本文件内，无外部依赖）：
    1. REOPEN_AT   —— 预计恢复时间文案（见 <script> 顶部）
    2. 联系方式     —— 搜索 mailto: 与 tel: 两处
    3. 年份/公司名   —— 页脚 footer
    4. 文案         —— <script> 中的 I18N 字典（中/英）

  字体说明：本页刻意不引 Google Fonts，避免国内访问阻塞渲染。
  若确认访客主要在境外、想与官网字体完全一致，在 </head> 前加：
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  ============================================================
-->
<style>
:root{
  --navy:#14324F; --navy-deep:#0D2135; --navy-light:#1A4A6E;
  --gold:#C9A227; --gold-light:#E8D067; --gold-soft:#F5EDD0;
  --red:#D84A30;
  --white:#FFFFFF; --off-white:#F8F6F0;
  --gray-100:#E8EAED; --gray-200:#D5D8DD; --gray-400:#8A919C;
  --gray-600:#5A6270; --gray-800:#2C323C; --gray-900:#171C24;
  --radius:14px;
  --shadow-lg:0 20px 48px rgba(20,50,79,0.14);
  --serif:'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',Georgia,serif;
  --sans:'Noto Sans SC','PingFang SC','Microsoft YaHei',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}

*{box-sizing:border-box;margin:0;padding:0;}

/* 注意：body 的 min-height 用视口单位而非 100%。
   百分比 min-height 在父元素（html）高度为 auto 时会被忽略，导致 body 撑不满视口、
   卡片贴顶而不是垂直居中。dvh 用于规避移动端浏览器地址栏高度抖动。 */
html{min-height:100%;}

body{
  min-height:100vh;
  min-height:100dvh;
  font-family:var(--sans);
  background:var(--off-white);
  color:var(--gray-800);
  line-height:1.75;
  -webkit-font-smoothing:antialiased;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:clamp(16px,4vw,48px);
  /* 顶部品牌色渐变光带，呼应官网 AI 区块的藏青渐变 */
  background-image:
    radial-gradient(1200px 380px at 50% -8%,rgba(20,50,79,0.10),transparent 70%),
    linear-gradient(180deg,rgba(13,33,53,0.05),transparent 220px);
  background-repeat:no-repeat;
}

/* 顶部 3px 金色分隔条（沿用 family-card::after 的品牌手法） */
body::before{
  content:'';position:fixed;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--gold),var(--gold-light));
  z-index:9;
}

.card{
  width:100%;
  max-width:560px;
  min-width:0;                 /* 防止 flex 子项被内容撑破 */
  background:var(--white);
  border:1px solid var(--gray-100);
  border-radius:var(--radius);
  box-shadow:var(--shadow-lg);
  padding:clamp(28px,6vw,52px) clamp(22px,5.5vw,48px);
  text-align:center;
  /* 安全居中：内容高于视口时（如 360x640 老安卓），align-items:center 会把顶部
     裁掉且无法向上滚动；margin:auto 在空间不足时按 0 计算，保证顶部可达。 */
  margin:auto;
  position:relative;
  overflow:hidden;
  animation:rise .6s cubic-bezier(.22,.61,.36,1) both;
}
.card::before{
  content:'';position:absolute;top:-45%;right:-22%;
  width:70%;height:70%;border-radius:50%;
  background:radial-gradient(circle,rgba(201,162,39,0.14),transparent 62%);
  pointer-events:none;
}
.card > *{position:relative;z-index:1;}

@keyframes rise{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:none;}}

/* ---------- LOGO ---------- */
.logo{
  width:clamp(104px,22vw,136px);
  height:auto;
  display:block;
  margin:0 auto clamp(14px,3vw,20px);
}

/* ---------- 品牌锁版 ---------- */
.brand-cn{
  font-family:var(--serif);
  font-size:clamp(19px,4.6vw,23px);
  font-weight:700;
  color:var(--navy);
  letter-spacing:.04em;
}
.brand-en{
  font-family:var(--serif);
  font-size:clamp(9.5px,2.4vw,11px);
  font-weight:400;
  color:var(--gray-400);
  letter-spacing:.22em;
  margin-top:6px;
}

.rule{
  width:56px;height:2px;margin:clamp(16px,3.4vw,22px) auto;
  background:linear-gradient(90deg,var(--gold),var(--gold-light));
  border-radius:2px;
}

/* ---------- 主文案 ---------- */
h1{
  font-family:var(--serif);
  font-size:clamp(25px,6.4vw,34px);
  font-weight:700;
  color:var(--navy);
  letter-spacing:.03em;
  line-height:1.35;
  margin-bottom:14px;
}
.lead{
  font-size:clamp(13.5px,3.5vw,15px);
  color:var(--gray-600);
  max-width:44ch;
  margin:0 auto;
  line-height:1.85;
  overflow-wrap:anywhere;      /* 长英文单词不撑破容器 */
}

/* ---------- 状态条 ---------- */
.status{
  display:inline-flex;
  align-items:center;
  gap:9px;
  flex-wrap:wrap;
  justify-content:center;
  margin-top:clamp(20px,4vw,26px);
  padding:8px 16px;
  background:var(--gold-soft);
  border:1px solid rgba(201,162,39,0.34);
  border-radius:999px;
  font-size:13px;
  color:#7A6415;
  font-weight:500;
  max-width:100%;
  overflow-wrap:anywhere;
}
.dot{
  width:8px;height:8px;border-radius:50%;
  background:var(--gold);
  flex:0 0 auto;
  box-shadow:0 0 0 0 rgba(201,162,39,.55);
  animation:pulse 1.9s ease-out infinite;
}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(201,162,39,.55);}
  70%{box-shadow:0 0 0 11px rgba(201,162,39,0);}
  100%{box-shadow:0 0 0 0 rgba(201,162,39,0);}
}

/* ---------- 进度条 ---------- */
.bar{
  margin:clamp(22px,4.5vw,30px) 0 0;
  height:4px;
  border-radius:999px;
  background:var(--gray-100);
  overflow:hidden;
}
.bar > i{
  display:block;height:100%;width:38%;
  border-radius:999px;
  background:linear-gradient(90deg,var(--navy),var(--navy-light),var(--gold));
  animation:slide 2.4s ease-in-out infinite;
}
@keyframes slide{
  0%{transform:translateX(-105%);}
  100%{transform:translateX(275%);}
}

/* ---------- 联系方式 ---------- */
.contact{margin-top:clamp(26px,5.5vw,36px);}
.c-label{
  font-size:12.5px;color:var(--gray-400);
  margin-bottom:14px;letter-spacing:.02em;
}
.c-row{
  display:flex;gap:12px;justify-content:center;
  flex-wrap:wrap;                 /* 窄屏自动换行，避免横向溢出 */
}
.c-row a{
  min-width:0;
  display:inline-flex;align-items:center;gap:8px;
  padding:10px 18px;
  border:1px solid var(--gray-200);
  border-radius:999px;
  color:var(--navy);
  text-decoration:none;
  font-size:13.5px;font-weight:500;
  transition:border-color .25s,color .25s,background .25s,transform .25s;
  overflow-wrap:anywhere;
}
.c-row a:hover{
  border-color:var(--gold);
  background:var(--gold-soft);
  transform:translateY(-2px);
}
.c-row a .k{color:var(--gold);font-size:13px;flex:0 0 auto;}

/* ---------- 语言切换 ---------- */
.lang{
  position:fixed;top:18px;right:16px;z-index:20;
  display:flex;gap:4px;
  background:var(--white);
  border:1px solid var(--gray-200);
  border-radius:999px;
  padding:3px;
  box-shadow:0 2px 10px rgba(20,50,79,.08);
}
.lang button{
  border:0;background:transparent;cursor:pointer;
  font-family:var(--sans);font-size:12.5px;font-weight:600;
  color:var(--gray-400);
  padding:5px 13px;border-radius:999px;
  transition:background .25s,color .25s;
}
.lang button.on{background:var(--navy);color:var(--white);}

/* ---------- 页脚 ---------- */
footer{
  margin-top:clamp(26px,5.5vw,34px);
  padding-top:clamp(16px,3.4vw,20px);
  border-top:1px dashed var(--gray-200);
  font-size:11.5px;
  color:var(--gray-400);
  line-height:1.9;
  overflow-wrap:anywhere;
}

@media (max-width:400px){
  .c-row a{width:100%;justify-content:center;}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none !important;transition:none !important;}
}
</style>
</head>

  zh: {
    title:  '网站维护中',
    lead:   '我们正在对官网进行升级改造，以提供更专业的知识产权与 AI 服务体验。感谢您的理解与耐心。',

function setLang(lang) {
  if (!I18N[lang]) return;
  currentLang = lang;
  var d = I18N[lang];
  document.documentElement.lang = (lang === 'zh') ? 'zh-CN' : 'en';

    if (val) el.innerHTML = val;
  });
  document.getElementById('langZh').classList.toggle('on', lang === 'zh');
  document.getElementById('langEn').classList.toggle('on', lang === 'en');
  try { localStorage.setItem('huining-lang', lang); } catch (e) {}
}

document.getElementById('langZh').addEventListener('click', function () { setLang('zh'); });
document.getElementById('langEn').addEventListener('click', function () { setLang('en'); });
